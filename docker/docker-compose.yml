services:

  postgres:
    image: postgres:16
    container_name: atlas-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas123
      POSTGRES_DB: atlas

    ports:
      - "15432:5432"

    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: atlas-n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: atlas
      DB_POSTGRESDB_USER: atlas
      DB_POSTGRESDB_PASSWORD: atlas123

      GENERIC_TIMEZONE: Asia/Tehran
      TZ: Asia/Tehran

      API_URL: ${AI_API_URL}
      TRANSCRIPTION_API_URL: ${TRANSCRIPTION_API_URL}
      API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      ATLAS_MANAGER_EMAIL: ${ATLAS_MANAGER_EMAIL:-}
      ATLAS_SMTP_FROM: ${ATLAS_SMTP_FROM:-}

      # Basic Auth for n8n (added)
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: 'mmdjolan'
      N8N_BASIC_AUTH_PASSWORD: 'jolan1380'

      N8N_SECURE_COOKIE: false
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false

    volumes:
      - ./n8n/data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy

  mailer:
    image: python:3.12-slim
    container_name: atlas-mailer
    restart: unless-stopped
    working_dir: /app
    command: ["python", "mailer.py"]
    ports:
      - "8765:8765"
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.yahoo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ATLAS_MANAGER_EMAIL: ${ATLAS_MANAGER_EMAIL:-}
      MAILER_PORT: 8765
    volumes:
      - ./mailer:/app

  panel:
    build: ./panel
    container_name: atlas-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: atlas
      DB_USER: atlas
      DB_PASSWORD: atlas123
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      PANEL_TITLE: ${PANEL_TITLE:-پنل مدیریت اطلس}
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/atlas/call-intelligence
      TRANSCRIPTION_API_URL: ${TRANSCRIPTION_API_URL:-http://host.docker.internal:11434/v1/audio/transcriptions}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started